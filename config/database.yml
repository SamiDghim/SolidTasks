default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: sq_demo_development

test:
  <<: *default
  database: sq_demo_test

production:
  primary: &primary_production
    <<: *default
    database: sq_demo_production
    username: sq_demo
    password: <%= ENV["SQ_DEMO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: sq_demo_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: sq_demo_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: sq_demo_production_cable
    migrations_paths: db/cable_migrate
